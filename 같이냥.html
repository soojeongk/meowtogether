<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>같이냥 🐱</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:'Apple SD Gothic Neo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(160deg,#FFF5EC 0%,#FFE4CC 100%);color:#3D2B1F}
.app-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.app-card{width:100%;max-width:400px;background:#FFFFFF;border-radius:28px;box-shadow:0 16px 48px rgba(180,100,60,.13),0 2px 8px rgba(180,100,60,.07);overflow:hidden}

/* 랜딩 */
#landing .app-card{padding:32px 24px 24px;text-align:center}
.landing-cat{width:130px;height:auto;margin:0 auto 4px;filter:drop-shadow(0 8px 16px rgba(180,100,60,.2));animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.app-name{font-size:26px;font-weight:800;letter-spacing:-.5px;color:#3D2B1F;margin-bottom:2px}
.app-sub{color:#C4A08A;font-size:13px;margin-bottom:22px}
.inp{width:100%;padding:12px 16px;background:#FFF8F4;border:2px solid #EEE2D8;border-radius:14px;font-size:15px;font-family:inherit;color:#3D2B1F;outline:none;transition:border-color .2s;margin-bottom:9px}
.inp::placeholder{color:#C4A08A}
.inp:focus{border-color:#FF8C69}
.inp.shake{animation:shake .3s ease;border-color:#FF5252}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.inp-label{font-size:11px;font-weight:700;color:#C4A08A;text-align:left;margin-bottom:4px;display:block}
.btn{width:100%;padding:13px;border:none;border-radius:14px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:transform .1s;margin-bottom:8px}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#FF8C69,#FF6843);color:#fff;box-shadow:0 4px 16px rgba(255,105,67,.3)}
.btn-secondary{background:#F5EFE9;color:#8B5E3C}
.divider{display:flex;align-items:center;gap:10px;color:#D4B8A8;font-size:12px;margin:4px 0 10px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#EEE2D8}

/* 탑바 */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 12px;border-bottom:1.5px solid #FFF0E6}
.room-info{display:flex;align-items:center;gap:6px}
.online-dot{width:7px;height:7px;border-radius:50%;background:#4CAF50;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.room-code{font-size:12px;font-weight:700;color:#C4A08A;letter-spacing:.5px}
.member-badge{background:#FFF0E6;border-radius:20px;padding:2px 8px;font-size:11px;font-weight:700;color:#FF8C69}
.topbar-invite{background:#FF8C69;color:#fff;border:none;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;transition:background .2s}
.topbar-invite:hover{background:#FF7055}

/* 집사 랭킹 */
.butler-section{margin:14px 16px 0;background:#FFF8F4;border-radius:18px;padding:12px 14px}
.butler-title{font-size:12px;font-weight:700;color:#C4A08A;text-align:center;margin-bottom:10px;letter-spacing:.3px}
.rank-list{display:flex;flex-direction:column;gap:8px}
.rank-item{display:flex;align-items:center;gap:8px}
.rank-crown{font-size:13px;width:18px;text-align:center;flex-shrink:0}
.rank-nick{font-size:12px;font-weight:700;color:#8B5E3C;width:52px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-bar-wrap{flex:1;height:10px;background:#EEE2D8;border-radius:5px;overflow:hidden}
.rank-bar{height:100%;border-radius:5px;background:linear-gradient(90deg,#FF8C69,#FFBE99);transition:width .8s cubic-bezier(.4,0,.2,1);min-width:2px}
.rank-score{font-size:11px;font-weight:700;color:#C4A08A;width:32px;text-align:right;flex-shrink:0}
.butler-reset{font-size:10px;color:#D4B8A8;text-align:right;margin-top:8px}
.rank-empty{font-size:12px;color:#D4B8A8;text-align:center;padding:4px 0}
.score-legend{display:flex;justify-content:center;gap:10px;margin-top:7px}
.legend-item{font-size:10px;color:#C4A08A;background:#FFF0E6;padding:2px 8px;border-radius:10px}

/* 고양이 */
.cat-section{display:flex;flex-direction:column;align-items:center;padding:16px 18px 6px;position:relative}
.cat-glow{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:200px;height:50px;background:radial-gradient(ellipse,rgba(255,140,105,.15) 0%,transparent 70%);border-radius:50%;pointer-events:none}
.cat-name-label{font-size:13px;font-weight:800;color:#C4703A;letter-spacing:.5px;margin-bottom:2px}
#cat-gif{width:160px;height:auto;position:relative;z-index:1;cursor:pointer;transition:filter .4s,transform .15s;filter:drop-shadow(0 8px 20px rgba(180,100,60,.2))}
#cat-gif:hover{transform:scale(1.04)}
#cat-gif.happy-glow{filter:drop-shadow(0 6px 24px rgba(255,200,80,.55))}
#cat-gif.sad-filter{filter:grayscale(50%) brightness(.75) drop-shadow(0 4px 10px rgba(0,0,0,.15))}
.speech-wrap{min-height:30px;display:flex;align-items:center;justify-content:center;margin-top:4px}
#bubble{background:#FFF0E6;border:1.5px solid #FFD0B5;border-radius:16px 16px 16px 4px;padding:6px 14px;font-size:13px;font-weight:600;color:#C4703A;opacity:0;transform:translateY(4px);transition:opacity .25s,transform .25s;white-space:nowrap}
#bubble.show{opacity:1;transform:translateY(0)}

/* 액션 버튼 */
.actions{display:flex;gap:9px;padding:10px 18px 14px}
.action-btn{flex:1;padding:14px 6px 10px;border:none;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:5px;font-family:inherit;cursor:pointer;transition:transform .1s,box-shadow .15s}
.action-btn:active{transform:scale(.93)}
.action-btn .icon{font-size:24px;line-height:1}
.action-btn .label{font-size:11px;font-weight:700}
.action-btn .pts{font-size:9px;font-weight:600;opacity:.7;margin-top:-3px}
.btn-pet{background:#FFF0E6;color:#E07040;box-shadow:0 2px 8px rgba(255,140,105,.15)}
.btn-feed{background:#EAF4FF;color:#4A90C4;box-shadow:0 2px 8px rgba(100,181,246,.15)}
.btn-music{background:#F2EAFF;color:#8050C0;box-shadow:0 2px 8px rgba(155,111,212,.15)}

/* 히스토리 */
.history-section{margin:0 16px;background:#FFF8F4;border-radius:16px;padding:10px 12px}
.history-empty{font-size:12px;color:#D4B8A8;text-align:center;padding:8px 0}
.history-item{font-size:12px;color:#9B7B6E;padding:5px 0;border-bottom:1px solid #F0E8E0;line-height:1.4}
.history-item:last-child{border-bottom:none}
@keyframes slide-in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}

/* ── 최신 선물 카드 (모두에게 표시) ── */
.latest-gift{
  margin:10px 16px 16px;
  background:linear-gradient(135deg,#F4EFFF,#EBF0FF);
  border-radius:16px;padding:10px 14px;
  display:flex;align-items:center;gap:10px;
  cursor:pointer;animation:slide-in .3s ease;
}
.latest-gift .gift-icon{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#F4EFFF,#DDD5FF);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden}
.latest-gift .gift-icon img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.latest-gift .gift-info{flex:1;min-width:0}
.latest-gift .gift-from{font-size:10px;font-weight:700;color:#9B6FD4;margin-bottom:2px}
.latest-gift .gift-title{font-size:13px;font-weight:600;color:#3D2B1F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.latest-gift .gift-open{flex-shrink:0;padding:5px 12px;background:rgba(255,255,255,.75);border:none;border-radius:8px;font-size:11px;font-weight:700;color:#9B6FD4;cursor:pointer;font-family:inherit}

/* ── 우체통 플로팅 버튼 ── */
.mailbox-wrap{
  position:fixed;
  /* 카드 오른쪽에 붙도록: 카드 max 400px → 중앙에서 200px + 간격 */
  left:calc(50% + 210px);
  top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;align-items:center;
  z-index:200;
  /* 뷰포트가 좁으면 우하단 고정 */
}
@media(max-width:650px){
  .mailbox-wrap{left:auto;right:12px;top:auto;bottom:80px;transform:none}
}
.mailbox-btn{
  background:none;border:none;cursor:pointer;
  padding:0;position:relative;
  filter:drop-shadow(0 6px 18px rgba(180,100,60,.25));
  transition:transform .15s;
}
.mailbox-btn:active{transform:scale(.92)}
.mailbox-btn:hover{transform:scale(1.07)}
.mailbox-badge{
  position:absolute;top:-4px;right:-4px;
  background:#FF4D4D;color:#fff;
  font-size:10px;font-weight:800;
  min-width:18px;height:18px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  border:2px solid #fff;padding:0 3px;
}

/* ── 우체통 패널 (선물 히스토리) ── */
#mailbox-panel{
  display:none;position:fixed;inset:0;
  background:rgba(61,43,31,.45);backdrop-filter:blur(6px);
  align-items:center;justify-content:center;z-index:300;
}
#mailbox-panel.open{display:flex}
.mailbox-sheet{
  background:#fff;border-radius:20px;
  padding:20px 20px 24px;
  width:calc(100% - 40px);max-width:400px;
  box-shadow:0 8px 40px rgba(61,43,31,.2);
  max-height:75vh;display:flex;flex-direction:column;
}
.mailbox-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mailbox-header h3{font-size:17px;font-weight:800;color:#3D2B1F}
.mailbox-close{background:none;border:none;font-size:20px;cursor:pointer;color:#C4A08A;line-height:1}
.mailbox-list{overflow-y:auto;flex:1;min-height:0}
.gift-history-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 0;border-bottom:1px solid #F0E8E0;
}
.gift-history-item:last-child{border-bottom:none}
.gift-history-thumb{
  width:40px;height:40px;border-radius:10px;
  background:linear-gradient(135deg,#F4EFFF,#DDD5FF);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;overflow:hidden;
}
.gift-history-thumb img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.gift-history-info{flex:1;min-width:0}
.gift-history-from{font-size:10px;font-weight:700;color:#9B6FD4;margin-bottom:2px}
.gift-history-title{font-size:13px;font-weight:600;color:#3D2B1F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gift-history-time{font-size:10px;color:#C4A08A;margin-top:2px}
.gift-history-open{flex-shrink:0;padding:5px 10px;background:#F2EAFF;border:none;border-radius:8px;font-size:11px;font-weight:700;color:#9B6FD4;cursor:pointer;font-family:inherit}
.mailbox-empty{text-align:center;padding:32px 0;color:#D4B8A8;font-size:13px}

/* 파티클 */
.particle{position:fixed;pointer-events:none;z-index:500;font-size:22px;animation:float-up 1.1s ease-out forwards}
@keyframes float-up{0%{opacity:1;transform:translateY(0) scale(.7)}100%{opacity:0;transform:translateY(-80px) scale(1.2)}}

/* 음악 모달 */
#music-modal{display:none;position:fixed;inset:0;background:rgba(61,43,31,.4);backdrop-filter:blur(6px);align-items:flex-end;justify-content:center;z-index:300}
#music-modal.open{display:flex}
.modal-sheet{background:#fff;border-radius:28px 28px 0 0;padding:20px 22px 36px;width:100%;max-width:400px;box-shadow:0 -8px 40px rgba(180,100,60,.12)}
.modal-handle{width:36px;height:4px;background:#EEE2D8;border-radius:2px;margin:0 auto 18px}
.modal-title{font-size:17px;font-weight:800;margin-bottom:14px;color:#3D2B1F}
.modal-sheet .inp{margin-bottom:9px}

/* 토스트 */
#toast{position:fixed;top:50%;left:50%;z-index:400;transform:translate(-50%,-50%);background:rgba(61,43,31,.88);color:#fff;padding:11px 22px;border-radius:14px;font-size:13px;font-weight:600;pointer-events:none;opacity:0;transition:opacity .25s;text-align:center}
#toast.show{opacity:1}
.mb16{margin-bottom:16px}
</style>
</head>
<body>
<div class="app-wrap">

<!-- 랜딩 -->
<div id="landing" style="width:100%;max-width:400px">
  <div class="app-card" style="padding:32px 24px 24px;text-align:center">
    <img class="landing-cat" src="gif/calico-idle.gif" alt="고양이">
    <div class="app-name">같이냥</div>
    <div class="app-sub">친구와 함께 키우는 고양이 🐾</div>
    <label class="inp-label">내 닉네임</label>
    <input class="inp" id="inp-nick" type="text" placeholder="닉네임 입력" maxlength="10">
    <label class="inp-label">우리 고양이 이름 <span style="color:#D4B8A8;font-weight:400">(새 방 만들기 시 적용)</span></label>
    <input class="inp" id="inp-cat-name" type="text" placeholder="나비" maxlength="10" value="나비">
    <button class="btn btn-primary" onclick="createRoom()">새 방 만들기 ✨</button>
    <div class="divider">또는 방 코드로 입장</div>
    <input class="inp" id="inp-room" type="text" placeholder="방 코드 6자리" maxlength="6" style="letter-spacing:4px;text-transform:uppercase;text-align:center">
    <button class="btn btn-secondary" onclick="joinRoom()">입장하기 →</button>
  </div>
</div>

<!-- 메인 -->
<div id="main" style="width:100%;max-width:400px;display:none">
  <div class="app-card">
    <div class="topbar">
      <div class="room-info">
        <div class="online-dot"></div>
        <span class="room-code" id="room-label">------</span>
        <span class="member-badge" id="member-count">1명</span>
      </div>
      <button class="topbar-invite" onclick="shareRoom()">🔗 초대하기</button>
    </div>

    <div class="butler-section">
      <div class="butler-title">누구를 집사로 간택할까냥? 😸</div>
      <div class="rank-list" id="rank-list"><div class="rank-empty">입장한 멤버가 없어요</div></div>
      <div class="score-legend">
        <span class="legend-item">🖐️ +1점</span>
        <span class="legend-item">🍣 +1점</span>
        <span class="legend-item">🎵 +3점</span>
      </div>
      <div class="butler-reset" id="reset-time">오늘 자정에 리셋돼요</div>
    </div>

    <div class="cat-section">
      <div class="cat-glow"></div>
      <div class="cat-name-label" id="cat-name-label">🐱 나비</div>
      <img id="cat-gif" src="gif/calico-idle.gif" alt="나비" onclick="petCat()">
      <div class="speech-wrap"><div id="bubble">쓰다듬어 주세요!</div></div>
    </div>

    <div class="actions">
      <button class="action-btn btn-pet"   onclick="petCat()"><span class="icon">🖐️</span><span class="label">쓰다듬기</span><span class="pts">+1점</span></button>
      <button class="action-btn btn-feed"  onclick="feedCat()"><span class="icon">🍣</span><span class="label">밥주기</span><span class="pts">+1점</span></button>
      <button class="action-btn btn-music" onclick="openMusic()"><span class="icon">🎵</span><span class="label">음악선물</span><span class="pts">+3점</span></button>
    </div>

    <div class="history-section mb16" id="history-log">
      <div class="history-empty">아직 활동이 없어요</div>
    </div>

    <!-- 최신 선물 1개 (모두에게) -->
    <div id="latest-gift-wrap"></div>
  </div>
</div>
</div>

<!-- 우체통 플로팅 버튼 (메인 진입 후 표시) -->
<div class="mailbox-wrap" id="mailbox-wrap" style="display:none">
  <button class="mailbox-btn" onclick="openMailbox()" title="선물 우체통">
    <!-- 귀여운 우체통 SVG -->
    <svg width="64" height="72" viewBox="0 0 64 72" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- 기둥 -->
      <rect x="28" y="58" width="8" height="14" rx="3" fill="#C4803A"/>
      <!-- 몸통 -->
      <rect x="4" y="28" width="56" height="34" rx="8" fill="#F5A623"/>
      <!-- 아치 상단 -->
      <path d="M4 36 Q4 12 32 12 Q60 12 60 36" fill="#F5A623"/>
      <!-- 상단 테두리 -->
      <path d="M4 36 Q4 12 32 12 Q60 12 60 36 V56 Q60 62 54 62 H10 Q4 62 4 56 Z" stroke="#C4803A" stroke-width="2.5" fill="none"/>
      <!-- 편지 슬롯 -->
      <rect x="10" y="39" width="44" height="7" rx="3.5" fill="#3D2B1F" opacity="0.18"/>
      <rect x="10" y="39" width="44" height="3.5" rx="2" fill="#3D2B1F" opacity="0.1"/>
      <!-- 편지 -->
      <rect x="16" y="35" width="32" height="22" rx="3" fill="white"/>
      <path d="M16 38 L32 46 L48 38" stroke="#FFD0B5" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <!-- 하트 -->
      <path d="M29 51 Q29 48 32 50 Q35 48 35 51 Q35 54 32 56 Q29 54 29 51Z" fill="#FF8C69"/>
      <!-- MAIL 텍스트 -->
      <text x="32" y="26" text-anchor="middle" font-size="7" font-weight="900" fill="white" font-family="Arial,sans-serif" letter-spacing="1">MAIL</text>
      <!-- 물고기 장식 -->
      <ellipse cx="54" cy="22" rx="5" ry="3" fill="#90CAF9"/>
      <path d="M59 22 L62 19 L62 25 Z" fill="#90CAF9"/>
      <circle cx="52.5" cy="21.5" r=".8" fill="#1565C0"/>
      <!-- 방울 장식 -->
      <line x1="9" y1="22" x2="9" y2="30" stroke="#C4803A" stroke-width="1.5"/>
      <circle cx="9" cy="32" r="3" fill="#F5A623" stroke="#C4803A" stroke-width="1"/>
      <path d="M7 36 Q9 38 11 36" stroke="#C4803A" stroke-width="1" fill="none"/>
    </svg>
    <span class="mailbox-badge" id="mailbox-badge" style="display:none">0</span>
  </button>
</div>

<!-- 우체통 패널 -->
<div id="mailbox-panel" onclick="closeMailboxOut(event)">
  <div class="mailbox-sheet">
    <div class="mailbox-header">
      <h3>📬 선물 우체통</h3>
      <button class="mailbox-close" onclick="closeMailbox()">✕</button>
    </div>
    <div class="mailbox-list" id="mailbox-list">
      <div class="mailbox-empty">아직 도착한 선물이 없어요</div>
    </div>
  </div>
</div>

<!-- 음악 모달 -->
<div id="music-modal" onclick="closeModalOut(event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">🎵 음악 선물하기</div>
    <input class="inp" id="inp-music-title" type="text" placeholder="곡 제목">
    <input class="inp" id="inp-music-url"   type="text" placeholder="유튜브/멜론 링크 (선택)">
    <button class="btn btn-primary" onclick="sendMusic()" style="margin-top:4px">선물하기 🐾</button>
    <button class="btn btn-secondary" onclick="closeMusic()">취소</button>
  </div>
</div>
<div id="toast"></div>

  peek:["gif/calico-mini-peek.gif"]
};
function randGif(key){const a=GIF_SETS[key]||GIF_SETS.idle;return a[Math.floor(Math.random()*a.length)];}
let idleTimer=null;
function startIdleRotation(){
  if(window._gifLocked)return;
  const el=document.getElementById("cat-gif");
  el.src=randGif("idle");
  idleTimer=setTimeout(startIdleRotation,8000+Math.random()*4000);
}
const POINTS={pet:1,feed:1,music:3};

firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let catRef,feedRef,cardsRef,membersRef,myMemberRef;
let myNick="",roomId="",catName="나비";
let sessionCards=[];
const mySessionId=Math.random().toString(36).slice(2);
let bubbleTimer=null,joinTs=0,lastAnimKey=null;

function todayKey(){
  const d=new Date(Date.now()+9*60*60*1000);
  return d.toISOString().slice(0,10);
}

/* ── 랜딩 ── */
function genId(){return Math.random().toString(36).slice(2,8).toUpperCase();}
async function createRoom(){
  const nick=document.getElementById("inp-nick").value.trim();
  if(!nick) return shake("inp-nick");
  myNick=nick;
  catName=document.getElementById("inp-cat-name").value.trim()||"나비";
  roomId=genId();
  await db.ref("rooms/"+roomId+"/cat").set({name:catName,happiness:80,hunger:70,lastDecay:Date.now()});
  enter();
}
async function joinRoom(){
  const nick=document.getElementById("inp-nick").value.trim();
  const rid=document.getElementById("inp-room").value.trim().toUpperCase();
  if(!nick) return shake("inp-nick");
  if(rid.length<4) return shake("inp-room");
  myNick=nick; roomId=rid;
  const snap=await db.ref("rooms/"+roomId+"/cat").once("value");
  if(!snap.exists()){
    await db.ref("rooms/"+roomId+"/cat").set({name:"나비",happiness:80,hunger:70,lastDecay:Date.now()});
    catName="나비";
  } else { catName=(snap.val().name)||"나비"; }
  enter();
}
function shake(id){
  const el=document.getElementById(id);
  el.classList.remove("shake"); void el.offsetWidth;
  el.classList.add("shake");
  el.addEventListener("animationend",()=>el.classList.remove("shake"),{once:true});
  el.focus();
}

/* ── 진입 ── */
function enter(){
  joinTs=Date.now();
  document.getElementById("landing").style.display="none";
  document.getElementById("main").style.display="block";
  document.getElementById("mailbox-wrap").style.display="flex";
  document.getElementById("room-label").textContent=roomId;
  document.getElementById("cat-name-label").textContent="🐱 "+catName;

  catRef     =db.ref("rooms/"+roomId+"/cat");
  feedRef    =db.ref("rooms/"+roomId+"/feed");
  cardsRef   =db.ref("rooms/"+roomId+"/musicCards");
  membersRef =db.ref("rooms/"+roomId+"/members");
  myMemberRef=membersRef.child(mySessionId);

  const today=todayKey();
  myMemberRef.transaction(m=>{
    if(!m||m.date!==today) return{nick:myNick,score:0,date:today};
    return{...m,nick:myNick};
  });
  myMemberRef.onDisconnect().remove();

  const presRef=db.ref("rooms/"+roomId+"/presence/"+mySessionId);
  presRef.set({nick:myNick,ts:Date.now()});
  presRef.onDisconnect().remove();
  db.ref("rooms/"+roomId+"/presence").on("value",snap=>{
    document.getElementById("member-count").textContent=snap.numChildren()+"명";
  });

  membersRef.on("value",snap=>{
    const today2=todayKey(), members=[];
    snap.forEach(child=>{const m=child.val(); if(m&&m.date===today2) members.push(m);});
    renderRanking(members);
    updateCatGifByScore(members.reduce((s,m)=>s+(m.score||0),0));
  });

  feedRef.limitToLast(20).on("value",snap=>{
    const all=[]; let latestKey=null,latestVal=null;
    snap.forEach(child=>{all.push(child.val()); latestKey=child.key; latestVal=child.val();});
    renderHistory(all.slice(-3).reverse());
    if(latestKey&&latestKey!==lastAnimKey&&latestVal){
      if(latestVal.ts>joinTs&&latestVal.sessionId!==mySessionId) triggerRemoteAnim(latestVal);
      lastAnimKey=latestKey;
    }
  });

  // 최신 선물 카드 (메인 화면) - limitToLast(1)으로 항상 최신 1개 표시
  cardsRef.limitToLast(1).on("value",snap=>{
    let latest=null;
    snap.forEach(child=>{latest=child.val();});
    renderLatestGift(latest);
  });
  // 우체통 히스토리 - child_added로 새 선물마다 실시간 누적
  sessionCards=[];
  cardsRef.on("child_added",snap=>{
    sessionCards.unshift(snap.val());
    renderMailboxList(sessionCards);
  });

  updateResetTime();
  setInterval(updateResetTime,60000);
  setInterval(decay,10000);

  feedRef.push({type:"join",user:myNick,sessionId:mySessionId,msg:myNick+"님이 방에 들어왔어요 👋",ts:Date.now()});
  showBubble("안녕! 쓰다듬어 줘~ 🐱",3000);
  startIdleRotation();
}

function updateResetTime(){
  const now=new Date(Date.now()+9*60*60*1000);
  document.getElementById("reset-time").textContent="자정까지 "+(23-now.getUTCHours())+"시간 "+(59-now.getUTCMinutes())+"분 남음";
}

/* ── 랭킹 ── */
function renderRanking(members){
  const list=document.getElementById("rank-list");
  if(!members.length){list.innerHTML='<div class="rank-empty">입장한 멤버가 없어요</div>';return;}
  members.sort((a,b)=>(b.score||0)-(a.score||0));
  const max=Math.max(...members.map(m=>m.score||0),1);
  list.innerHTML=members.map((m,i)=>{
    const pct=Math.round(((m.score||0)/max)*100);
    const crown=i===0&&(m.score||0)>0?"👑":"　";
    return "<div class=\"rank-item\">"+
      "<span class=\"rank-crown\">"+crown+"</span>"+
      "<span class=\"rank-nick\" style=\""+( m.nick===myNick?"color:#FF8C69;font-weight:800":"" )+"\">" +esc(m.nick)+"</span>"+
      "<div class=\"rank-bar-wrap\"><div class=\"rank-bar\" style=\"width:"+Math.max(pct,2)+"%\"></div></div>"+
      "<span class=\"rank-score\">"+(m.score||0)+"점</span></div>";
  }).join("");
}

/* ── GIF ── */
function updateCatGifByScore(total){
  const el=document.getElementById("cat-gif");
  el.classList.remove("happy-glow","sad-filter");
  if(total===0)el.classList.add("sad-filter");
  else if(total>=10)el.classList.add("happy-glow");
}

/* ── decay ── */
function decay(){
  catRef.transaction(cat=>{
    if(!cat) return cat;
    const now=Date.now();
    if(now-(cat.lastDecay||now)<28000) return;
    cat.happiness=Math.max(0,cat.happiness-3);
    cat.hunger=Math.max(0,cat.hunger-5);
    cat.lastDecay=now;
    return cat;
  });
}

/* ── 액션 ── */
function petCat(){
  addScore(POINTS.pet);
  catRef.transaction(cat=>{if(!cat)return cat;cat.happiness=Math.min(100,cat.happiness+5);return cat;});
  feedRef.push({type:"pet",user:myNick,sessionId:mySessionId,msg:myNick+"님이 "+catName+"를 쓰다듬었어요 🐾",ts:Date.now()});
  setCatGif("pet",2200);spawnParticles(["💗","🐾","✨"],5);showBubble("기분 좋아요~ 😻",2000);
}
function feedCat(){
  addScore(POINTS.feed);
  catRef.transaction(cat=>{if(!cat)return cat;cat.hunger=Math.min(100,cat.hunger+20);cat.happiness=Math.min(100,cat.happiness+2);return cat;});
  feedRef.push({type:"feed",user:myNick,sessionId:mySessionId,msg:myNick+"님이 "+catName+"에게 밥을 줬어요 🍣",ts:Date.now()});
  setCatGif("feed",2500);spawnParticles(["🍣","🐟","✨"],4);showBubble("냠냠 맛있어요! 😸",2000);
}
function sendMusic(){
  const title=document.getElementById("inp-music-title").value.trim();
  const url=document.getElementById("inp-music-url").value.trim();
  if(!title) return shake("inp-music-title");
  addScore(POINTS.music);
  cardsRef.push({from:myNick,sessionId:mySessionId,title,url,ts:Date.now()});
  feedRef.push({type:"music",user:myNick,sessionId:mySessionId,msg:myNick+"님이 음악을 선물했어요 🎵",ts:Date.now()});
  setCatGif("music",2800);spawnParticles(["🎵","🎶","✨","💜"],6);showBubble("🎵 음악 선물 완료!",2000);
  closeMusic();
  document.getElementById("inp-music-title").value="";
  document.getElementById("inp-music-url").value="";
}
function addScore(pts){
  const today=todayKey();
  myMemberRef.transaction(m=>{
    if(!m||m.date!==today) return{nick:myNick,score:pts,date:today};
    return{...m,score:(m.score||0)+pts};
  });
}

/* ── 원격 애니메이션 ── */
function triggerRemoteAnim(a){
  if(a.type==="pet"){setCatGif("peek",1800);spawnParticles(["💗","🐾"],3);showBubble(a.user+"님이 쓰다듬었어요 🐾",2000);}
  if(a.type==="feed"){setCatGif("feed",2000);spawnParticles(["🍣"],3);showBubble(a.user+"님이 밥을 줬어요 🍣",2000);}
  if(a.type==="music"){setCatGif("music",2500);spawnParticles(["🎵","🎶"],4);showBubble(a.user+"님의 음악 선물! 🎵",2500);}
}

/* ── 히스토리 ── */
function renderHistory(items){
  const el=document.getElementById("history-log");
  if(!items.length){el.innerHTML='<div class="history-empty">아직 활동이 없어요</div>';return;}
  el.innerHTML=items.map(f=>"<div class=\"history-item\">💬 "+esc(f.msg||"")+"</div>").join("");
}

/* ── 최신 선물 1개 (모두에게) ── */
function renderLatestGift(card){
  const wrap=document.getElementById("latest-gift-wrap");
  if(!card){wrap.innerHTML="";return;}
  const ytId=parseYouTubeId(card.url);
  const hasUrl=card.url&&card.url.startsWith("http");
  const thumb=ytId
    ? "<img src=\"https://img.youtube.com/vi/"+ytId+"/mqdefault.jpg\" alt=\"\"/>"
    : "🎵";
  const isImg=!!ytId;
  wrap.innerHTML="<div class=\"latest-gift\" "+(hasUrl?"onclick=\"openUrl('"+esc(card.url)+"')\"":"")+">"
    +"<div class=\"gift-icon\">"+thumb+"</div>"
    +"<div class=\"gift-info\">"
      +"<div class=\"gift-from\">"+esc(card.from)+"님이 보낸 선물 🎁</div>"
      +"<div class=\"gift-title\">"+esc(card.title)+"</div>"
    +"</div>"
    +(hasUrl?"<button class=\"gift-open\" onclick=\"event.stopPropagation();openUrl('"+esc(card.url)+"')\">열기</button>":"")
  +"</div>";
}

/* ── 우체통 히스토리 목록 ── */
function renderMailboxList(cards){
  const list=document.getElementById("mailbox-list");
  // 배지 업데이트
  const badge=document.getElementById("mailbox-badge");
  if(cards.length>0){badge.style.display="flex";badge.textContent=cards.length>99?"99+":cards.length;}
  else{badge.style.display="none";}

  if(!cards.length){list.innerHTML='<div class="mailbox-empty">아직 도착한 선물이 없어요 🐾</div>';return;}
  list.innerHTML=cards.map(c=>{
    const ytId=parseYouTubeId(c.url);
    const hasUrl=c.url&&c.url.startsWith("http");
    const thumb=ytId
      ? "<img src=\"https://img.youtube.com/vi/"+ytId+"/mqdefault.jpg\" alt=\"\"/>"
      : "🎵";
    const timeStr=c.ts?fmtTime(c.ts):"";
    return "<div class=\"gift-history-item\">"
      +"<div class=\"gift-history-thumb\">"+thumb+"</div>"
      +"<div class=\"gift-history-info\">"
        +"<div class=\"gift-history-from\">"+esc(c.from)+"님의 선물</div>"
        +"<div class=\"gift-history-title\">"+esc(c.title)+"</div>"
        +"<div class=\"gift-history-time\">"+timeStr+"</div>"
      +"</div>"
      +(hasUrl?"<button class=\"gift-history-open\" onclick=\"openUrl('"+esc(c.url)+"')\">열기</button>":"")
    +"</div>";
  }).join("");
}

function fmtTime(ts){
  const d=new Date(ts);
  const hh=String(d.getHours()).padStart(2,"0");
  const mm=String(d.getMinutes()).padStart(2,"0");
  const mo=d.getMonth()+1, dd=d.getDate();
  const today=new Date();
  if(d.toDateString()===today.toDateString()) return hh+":"+mm;
  return mo+"/"+dd+" "+hh+":"+mm;
}

/* ── GIF 전환 ── */
function setCatGif(state,ms){
  clearTimeout(idleTimer);
  clearTimeout(window._gifTimer);
  window._gifLocked=true;
  const el=document.getElementById("cat-gif");
  el.src=randGif(state);
  el.classList.remove("happy-glow","sad-filter");
  if(state==="pet")el.classList.add("happy-glow");
  window._gifTimer=setTimeout(()=>{window._gifLocked=false;startIdleRotation();},ms);
}
function showBubble(msg,ms){
  const b=document.getElementById("bubble");
  b.textContent=msg;b.classList.add("show");
  clearTimeout(bubbleTimer);
  bubbleTimer=setTimeout(()=>b.classList.remove("show"),ms);
}

/* ── 파티클 ── */
function spawnParticles(pool,count){
  const rect=document.getElementById("cat-gif").getBoundingClientRect();
  for(let i=0;i<count;i++){
    setTimeout(()=>{
      const p=document.createElement("div");p.className="particle";
      p.textContent=pool[Math.floor(Math.random()*pool.length)];
      p.style.left=(rect.left+Math.random()*rect.width)+"px";
      p.style.top=(rect.top+Math.random()*rect.height)+"px";
      document.body.appendChild(p);
      p.addEventListener("animationend",()=>p.remove(),{once:true});
    },i*110);
  }
}

/* ── 유튜브 ── */
function parseYouTubeId(url){
  if(!url)return null;
  const m=url.match(/[?&]v=([A-Za-z0-9_-]{11})/)||url.match(/youtu\.be\/([A-Za-z0-9_-]{11})/);
  return m?m[1]:null;
}
function openUrl(url){window.open(url,"_blank","noopener,noreferrer");}
function esc(str){return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

/* ── 우체통 ── */
function openMailbox(){document.getElementById("mailbox-panel").classList.add("open");}
function closeMailbox(){document.getElementById("mailbox-panel").classList.remove("open");}
function closeMailboxOut(e){if(e.target===document.getElementById("mailbox-panel"))closeMailbox();}

/* ── 음악 모달 ── */
function openMusic(){document.getElementById("music-modal").classList.add("open");}
function closeMusic(){document.getElementById("music-modal").classList.remove("open");}
function closeModalOut(e){if(e.target===document.getElementById("music-modal"))closeMusic();}

/* ── 초대 ── */
function shareRoom(){
  const url=location.href.split("#")[0]+"#room="+roomId;
  const text="같이냥 방 코드: "+roomId+"\n링크: "+url;
  const isSecure=location.protocol==="https:"||location.hostname==="localhost";
  if(isSecure&&navigator.share){
    navigator.share({title:"같이냥",text,url}).catch(()=>execCopy(text));
  } else { execCopy(text); }
}
function execCopy(text){
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(()=>toast("📋 초대 링크 복사됨!")).catch(()=>legacyCopy(text));
  } else { legacyCopy(text); }
}
function legacyCopy(text){
  const ta=document.createElement("textarea");
  ta.value=text;ta.style.cssText="position:fixed;opacity:0;top:0;left:0";
  document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");toast("📋 초대 링크 복사됨!");}
  catch(e){toast("방 코드: "+roomId);}
  document.body.removeChild(ta);
}
function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg;el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),2300);
}

window.addEventListener("load",()=>{
  const m=location.hash.match(/#room=([A-Z0-9]{4,8})/i);
  if(m)document.getElementById("inp-room").value=m[1].toUpperCase();
});
</script>
